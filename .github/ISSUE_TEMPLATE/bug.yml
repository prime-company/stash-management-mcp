name: 🐛 Bug report
description: Something with the connector isn't working as expected.
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: client
    attributes:
      label: Which AI app?
      options:
        - ChatGPT
        - Claude Desktop
        - Claude (claude.ai)
        - Claude Code
        - Cursor
        - VS Code
        - Other MCP client
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong? Include exact error text if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
  - type: input
    id: tool
    attributes:
      label: Tool / command involved (if known)
      placeholder: e.g. search_inventory, /stash-summary, connecting/auth
    validations:
      required: false
