name: ❓ Question / help
description: A question about connecting or using the MCP connector.
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Many setup and usage questions are already answered in the
        [help docs](https://www.stashmanagement.com/help/ai-connections) — worth a quick look first.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Which AI app? (if relevant)
      placeholder: e.g. ChatGPT, Claude, Cursor
    validations:
      required: false
