name: 💡 Feature request
description: Suggest a tool, capability, or improvement for the connector.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The goal or problem, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: false
